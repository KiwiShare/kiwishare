name: Mobile CI Pipeline

on:
  push:
    branches: [ main, pre ]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    branches: [ main, pre ]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'

jobs:
  mobile_ci:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.vfs.watch=false -Dorg.gradle.caching=true

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'
          cache-dependency-path: |
            mobile/android/**/*.gradle*
            mobile/android/gradle/wrapper/gradle-wrapper.properties
            mobile/pubspec.lock

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.5'
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run code analysis (Linter)
        run: flutter analyze

      - name: Verify code formatting
        run: dart format --set-exit-if-changed lib/ test/

      - name: Run unit and widget tests
        run: flutter test

      # A push to pre already verifies the exact SHA with a release APK build.
      # Skip the duplicate build on the long-lived pre -> main promotion PR;
      # feature PRs still build release APKs before they can enter pre.
      - name: Verify Android release build
        if: ${{ github.event_name != 'pull_request' || github.head_ref != 'pre' }}
        run: flutter build apk --release --no-pub
