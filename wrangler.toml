name = "kiwishare-web"
main = "./worker.js"
compatibility_date = "2026-09-26"
routes = [
  { pattern = "kiwishare.online", custom_domain = true },
  { pattern = "www.kiwishare.online", custom_domain = true }
]

[assets]
directory = "./web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true
